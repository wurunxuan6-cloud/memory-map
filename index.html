<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>我们的数字轨迹</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1390.0.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #050505; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #navbar { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(255, 255, 255, 0.9); padding: 10px 20px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; gap: 15px; }
        .btn { cursor: pointer; padding: 8px 16px; border-radius: 20px; border: none; font-weight: bold; }
        #admin-panel { display: none; position: absolute; top: 0; right: 0; bottom: 0; width: 400px; background: white; z-index: 20; padding: 20px; overflow-y: auto; }
    </style>
</head>
<body>
<div id="navbar">
    <button id="toggle-edit" class="btn">✏️ 开启打点</button>
    <button id="open-admin" class="btn">⚙️ 照片墙</button>
</div>
<div id="admin-panel">
    <h3>回忆管理</h3>
    <div id="admin-list"></div>
    <button id="close-admin">关闭</button>
</div>
<div id="map"></div>
<script>
    // 你的配置信息（完全保留）
    const config = {
        mapboxToken: 'pk.eyJ1IjoibTR1MmkiLCJhIjoiY21yajV5dW1pMXk5ajJ6cno2MG9uOGpzOSJ9.gkwS48J4kiJPsrahuWmBoQ',
        supabaseUrl: 'https://wetlwqgqjgjjwdtixkrv.supabase.co',
        supabaseKey: 'sb_publishable_1G54HWWr0cQD9mkICGFvig_gKnx_w2w',
        r2Endpoint: 'https://541484c5eafbd3c7af121181490891d3.r2.cloudflarestorage.com',
        r2AccessKey: '8ad99951b3b4fb04b5400b609eed2c9b',
        r2SecretKey: 'e6a2b1d6ddfe043abc9a083c0f8da273cb5723c8c2b9483cb44d7f52c4330092',
        r2PublicUrl: 'https://pub-f4742f96554a43cda5aaad4ca7e8f4d6.r2.dev',
        r2Bucket: 'memories'
    };

    mapboxgl.accessToken = config.mapboxToken;
    const supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseKey);
    AWS.config.update({ accessKeyId: config.r2AccessKey, secretAccessKey: config.r2SecretKey });
    const s3 = new AWS.S3({ endpoint: config.r2Endpoint, signatureVersion: 'v4', s3ForcePathStyle: true });

    // 初始化地图
    const map = new mapboxgl.Map({ 
        container: 'map', 
        style: 'mapbox://styles/mapbox/satellite-streets-v12', 
        center: [100, 30], 
        zoom: 2 
    });

    // ==========================================
    // 以下是帮你补齐的“后续业务逻辑”，没有它们按钮点不动
    // ==========================================

    let currentMarkers = []; // 记录地图上的标记

    // 1. 读取数据库，把红点显示在地图上
    async function loadPoints() {
        const { data, error } = await supabaseClient.from('journey_points').select('*');
        if (error) {
            console.error("加载数据失败:", error);
            return;
        }

        // 清理旧标记
        currentMarkers.forEach(m => m.remove());
        currentMarkers = [];
        const adminList = document.getElementById('admin-list');
        adminList.innerHTML = '';

        data.forEach(point => {
            // 在地图上加点
            const marker = new mapboxgl.Marker({ color: '#ff4d4f' })
                .setLngLat([point.lng, point.lat])
                .setPopup(new mapboxgl.Popup().setText(point.title))
                .addTo(map);
            currentMarkers.push(marker);

            // 在照片墙面板里加文字记录
            adminList.innerHTML += `<p>📍 <strong>${point.title}</strong></p>`;
        });
    }

    // 地图加载完后自动拉取数据
    map.on('load', loadPoints);

    // 2. 开启/关闭打点功能
    let isEditing = false;
    document.getElementById('toggle-edit').addEventListener('click', (e) => {
        isEditing = !isEditing;
        e.target.innerText = isEditing ? '🛑 停止打点' : '✏️ 开启打点';
        alert(isEditing ? "打点已开启！直接点击地图记录位置。" : "打点已关闭。");
    });

    // 3. 点击地图触发保存
    map.on('click', async (e) => {
        if (!isEditing) return; // 如果没开启打点，点地图没反应
        
        const title = prompt("输入这个地点的名字:");
        if (!title) return; 

        const { lng, lat } = e.lngLat;
        
        // 存入 Supabase
        const { error } = await supabaseClient
            .from('journey_points')
            .insert([{ title: title, lng: lng, lat: lat, description: '打卡记录' }]);

        if (error) {
            alert("保存失败: " + error.message);
        } else {
            alert("保存成功！");
            loadPoints(); // 刷新地图上的点
        }
    });

    // 4. 照片墙面板的开关
    document.getElementById('open-admin').addEventListener('click', () => {
        document.getElementById('admin-panel').style.display = 'block';
    });
    document.getElementById('close-admin').addEventListener('click', () => {
        document.getElementById('admin-panel').style.display = 'none';
    });
</script>
</body>
</html>

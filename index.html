<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>我们的数字轨迹</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1390.0.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #050505; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #control-panel { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(255, 255, 255, 0.95); padding: 15px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 10px; width: 300px; }
        .input-box { padding: 8px; border: 1px solid #ccc; border-radius: 6px; width: 100%; box-sizing: border-box; }
        .btn { cursor: pointer; padding: 10px; border-radius: 6px; border: none; font-weight: bold; background: #1890ff; color: white; transition: 0.3s; }
        .btn:hover { background: #40a9ff; }
        .btn-secondary { background: #fff; color: #333; border: 1px solid #ddd; }
        .btn-secondary:hover { background: #f0f0f0; }
        #admin-panel { display: none; position: absolute; top: 0; right: 0; bottom: 0; width: 380px; background: white; z-index: 20; padding: 20px; overflow-y: auto; }
        .memory-card { border-bottom: 1px solid #eee; padding: 15px 0; }
        .memory-img { width: 100%; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

<div id="control-panel">
    <h3 style="margin: 0 0 10px 0;">📍 添加新足迹</h3>
    <input type="text" id="address-input" class="input-box" placeholder="输入地址 (如: 巴黎铁塔)">
    <input type="file" id="photo-input" class="input-box" accept="image/*">
    <button id="submit-btn" class="btn">🚀 飞往并上传打卡</button>
    <button id="open-admin" class="btn btn-secondary">🖼️ 打开照片墙</button>
</div>

<div id="admin-panel">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin: 0;">我们的照片墙</h2>
        <button id="close-admin" class="btn btn-secondary">关闭</button>
    </div>
    <div id="admin-list"></div>
</div>

<div id="map"></div>

<script>
    const config = {
        mapboxToken: 'pk.eyJ1IjoibTR1MmkiLCJhIjoiY21yajV5dW1pMXk5ajJ6cno2MG9uOGpzOSJ9.gkwS48J4kiJPsrahuWmBoQ', 
        supabaseUrl: 'https://wetlwqgqjgjjwdtixkrv.supabase.co',
        supabaseKey: 'sb_publishable_1G54HWWr0cQD9mkICGFvig_gKnx_w2w',
        r2Endpoint: 'https://541484c5eafbd3c7af121181490891d3.r2.cloudflarestorage.com',
        r2AccessKey: '8ad99951b3b4fb04b5400b609eed2c9b',
        r2SecretKey: 'e6a2b1d6ddfe043abc9a083c0f8da273cb5723c8c2b9483cb44d7f52c4330092',
        r2PublicUrl: 'https://pub-f4742f96554a43cda5aaad4ca7e8f4d6.r2.dev',
        r2Bucket: 'memories'
    };

    mapboxgl.accessToken = config.mapboxToken;
    const supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseKey);
    AWS.config.update({ accessKeyId: config.r2AccessKey, secretAccessKey: config.r2SecretKey });
    const s3 = new AWS.S3({ endpoint: config.r2Endpoint, signatureVersion: 'v4', s3ForcePathStyle: true });

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/satellite-streets-v12',
        center: [100, 30],
        zoom: 2,
        projection: 'globe'
    });

    async function loadPoints() {
        const { data } = await supabaseClient.from('journey_points').select('*').order('id', { ascending: false });
        if (!data) return;
        const adminList = document.getElementById('admin-list');
        adminList.innerHTML = '';
        data.forEach(point => {
            new mapboxgl.Marker({ color: '#ff4d4f' }).setLngLat([point.lng, point.lat]).addTo(map);
            adminList.innerHTML += `<div class="memory-card"><h3>📍 ${point.title}</h3>${point.image_url ? `<img src="${point.image_url}" class="memory-img">` : ''}</div>`;
        });
    }

    map.on('load', loadPoints);

    document.getElementById('submit-btn').addEventListener('click', async () => {
        const address = document.getElementById('address-input').value;
        const file = document.getElementById('photo-input').files[0];
        if (!address) return alert("请输入地址！");
        const btn = document.getElementById('submit-btn');
        btn.innerText = "处理中..."; btn.disabled = true;

        try {
            const geoRes = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(address)}.json?access_token=${config.mapboxToken}&limit=1`);
            const geoData = await geoRes.json();
            const coords = geoData.features[0].center;
            map.flyTo({ center: coords, zoom: 12 });

            let imageUrl = null;
            if (file) {
                const fileName = `${Date.now()}_${file.name}`;
                await s3.upload({ Bucket: config.r2Bucket, Key: fileName, Body: file, ContentType: file.type, ACL: 'public-read' }).promise();
                imageUrl = `${config.r2PublicUrl}/${fileName}`;
            }

            await supabaseClient.from('journey_points').insert([{ title: address, lng: coords[0], lat: coords[1], image_url: imageUrl }]);
            alert("成功！");
            loadPoints();
        } catch (err) { alert("出错，请检查网络: " + err.message); }
        btn.innerText = "🚀 飞往并上传打卡"; btn.disabled = false;
    });

    document.getElementById('open-admin').addEventListener('click', () => document.getElementById('admin-panel').style.display = 'block');
    document.getElementById('close-admin').addEventListener('click', () => document.getElementById('admin-panel').style.display = 'none');
</script>
</body>
</html>

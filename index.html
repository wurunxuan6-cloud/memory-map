<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>我们的数字轨迹</title>

    <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1390.0.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #050505; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #navbar { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(255, 255, 255, 0.9); padding: 10px 20px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; gap: 15px; }
        .btn { cursor: pointer; padding: 8px 16px; border-radius: 20px; border: none; font-weight: bold; }
        #admin-panel { display: none; position: absolute; top: 0; right: 0; bottom: 0; width: 400px; background: white; z-index: 20; padding: 20px; overflow-y: auto; }
    </style>
</head>
<body>
<div id="navbar">
    <button id="toggle-edit" class="btn">✏️ 开启打点</button>
    <button id="open-admin" class="btn">⚙️ 照片墙</button>
</div>
<div id="admin-panel"><h3>回忆管理</h3><div id="admin-list"></div><button id="close-admin">关闭</button></div>
<div id="map"></div>
<script>
    // 使用环境变量注入凭证
    const config = {
        mapboxToken: process.env.ENV_MAPBOX_TOKEN,
        supabaseUrl: process.env.ENV_SUPABASE_URL,
        supabaseKey: process.env.ENV_SUPABASE_KEY,
        r2Endpoint: process.env.ENV_R2_ENDPOINT,
        r2AccessKey: process.env.ENV_R2_ACCESS_KEY,
        r2SecretKey: process.env.ENV_R2_SECRET_KEY,
        r2PublicUrl: process.env.ENV_R2_PUBLIC_URL,
        r2Bucket: process.env.ENV_R2_BUCKET_NAME
    };

    mapboxgl.accessToken = config.mapboxToken;
    const supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseKey);
    AWS.config.update({ accessKeyId: config.r2AccessKey, secretAccessKey: config.r2SecretKey });
    const s3 = new AWS.S3({ endpoint: config.r2Endpoint, signatureVersion: 'v4', s3ForcePathStyle: true });

    // 初始化地图与逻辑 (此处省略部分业务逻辑代码，保持结构完整)
    const map = new mapboxgl.Map({ container: 'map', style: 'mapbox://styles/mapbox/satellite-streets-v12', center: [100, 30], zoom: 2 });
    // ... 后续逻辑与此前一致
</script>
</body>
</html>
